<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 09 - Formulario PHP</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f3f5f9;margin:0;padding:40px}
    .card{max-width:480px;margin:auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
    h1{margin-top:0;color:#1f3a5f;font-size:22px}
    label{display:block;margin:14px 0 4px;font-weight:600}
    input,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box}
    button{margin-top:18px;background:#1f6feb;color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer}
    a{color:#1f6feb;font-size:14px}
    .tag{display:inline-block;background:#777bb3;color:#fff;border-radius:4px;padding:2px 8px;font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">PHP</span>
    <h1>Formulario de contacto (POST)</h1>
    <form action="procesar.php" method="post">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required>
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required>
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
      <button type="submit">Enviar</button>
    </form>
    <p><a href="procesar.php">Probar acceso por GET (debe dar 405)</a></p>
    <p><a href="comparativa.html" style="display:inline-block;background:#1f3a5f;color:#fff;text-decoration:none;padding:10px 20px;border-radius:6px">📊 Ver comparativa PHP vs JSP</a></p>
  </div>
</body>
</html>
